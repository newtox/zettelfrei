services:
  zettelfrei:
    image: ghcr.io/newtox/zettelfrei:latest
    container_name: zettelfrei
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      APP_KEY: "base64:HIER_DEN_KEY_EINTRAGEN"
      APP_URL: "https://abstimmen.newtox.de"
      SESSION_SECURE_COOKIE: "true"
      ROOM_RETENTION_DAYS: "90"
      ADMIN_EMAIL: "justin.lys26@gmail.com"
      ADMIN_PASSWORD: "HIER_EIN_PASSWORT"
    volumes:
      - /docker_volumes/zettelfrei:/var/www/html/storage
